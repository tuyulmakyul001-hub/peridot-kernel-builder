name: Build POCO F6 (peridot) LineageOS 24.0 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Public GitHub kernel repo (owner/repo)"
        required: true
        type: string
        default: "tuyulmakyul001-hub/android_kernel_xiaomi_sm8635"
      kernel_branch:
        description: "Kernel repository branch to build"
        required: true
        type: string
        default: "lineage-24.0"
      root_variant:
        description: "Root integration variant"
        required: true
        type: choice
        default: "none"
        options:
          - none
          - kernelsu-next
          - kernelsu-next-susfs
      ksu_ref:
        description: "Optional KernelSU-Next branch or tag (blank = documented default)"
        required: false
        type: string
        default: ""
      local_version:
        description: "Optional kernel name suffix (blank = none)"
        required: false
        type: string
        default: ""
      clang_version:
        description: "Optional AOSP Clang override (e.g. r522817, r530567, r547379; blank = tree default)"
        required: false
        type: string
        default: ""
      tcp_congestion:
        description: "Default TCP congestion control (stock or BBR)"
        required: true
        type: choice
        default: "stock"
        options:
          - stock
          - bbr
      optimize_level:
        description: "Compiler optimization level (O2 default or O3)"
        required: true
        type: choice
        default: "O2"
        options:
          - O2
          - O3
      enable_mlgo:
        description: "Enable MLGO (ML-guided register allocation, if supported by Clang)"
        required: false
        type: boolean
        default: true
      enable_adios:
        description: "Enable ADIOS I/O scheduler on 6.1 (requires patches/adios-6.1.patch)"
        required: false
        type: boolean
        default: false
      enable_bore:
        description: "Apply KMI-safe BORE scheduler on 6.1 (requires patches/bore-6.1-kmi-safe.patch)"
        required: false
        type: boolean
        default: false
      bore_default_on:
        description: "Start BORE active at boot (sched_bore=1; applies when BORE is enabled)"
        required: false
        type: boolean
        default: true
      enable_baseband_guard:
        description: "Enable Baseband-guard LSM (boot/recovery stay writable)"
        required: false
        type: boolean
        default: false
      enable_droidspaces:
        description: "Enable Droidspaces container support (SYSVIPC/IPC/PID + GKI kABI patch)"
        required: false
        type: boolean
        default: false
      enable_unicode_fix:
        description: "Apply 6.1 Unicode zero-width path bypass fix"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      # Free up disk space on the GitHub-hosted runner before cloning and compiling
      - name: Free up disk space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      # Install required host tools, compiler helpers, ccache, pahole (dwarves), gawk, and zip utilities
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            gawk \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            python3 \
            tar \
            xz-utils \
            zip \
            zstd
          pahole --version

      # Check out this standalone builder repository (scripts, AnyKernel3 config, and local patches)
      - name: Checkout builder files
        uses: actions/checkout@v6
        with:
          path: builder
          fetch-depth: 1

      # Shallow-clone your public kernel fork on the selected LineageOS 24.0 branch
      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euxo pipefail
          if [[ ! "${KERNEL_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::kernel_repo must be in 'owner/repo' format."
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}.git" \
            kernel

      # Verify kernel version (6.1), required config files, Clang version (or override), and output naming metadata
      - name: Inspect kernel tree and compute build metadata
        env:
          ROOT_VARIANT: ${{ inputs.root_variant }}
          RAW_LOCAL_VERSION: ${{ inputs.local_version }}
          RAW_CLANG_VERSION: ${{ inputs.clang_version }}
          TCP_CONGESTION: ${{ inputs.tcp_congestion }}
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
          ENABLE_ADIOS: ${{ inputs.enable_adios }}
          ENABLE_BORE: ${{ inputs.enable_bore }}
          BORE_DEFAULT_ON: ${{ inputs.bore_default_on }}
          ENABLE_BASEBAND_GUARD: ${{ inputs.enable_baseband_guard }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_UNICODE_FIX: ${{ inputs.enable_unicode_fix }}
          ENABLE_NETHUNTER_USB: ${{ inputs.enable_nethunter_usb }}
        run: |
          set -euxo pipefail
          cd kernel

          VERSION="$(awk -F '=' '/^VERSION[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          PATCHLEVEL="$(awk -F '=' '/^PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          SUBLEVEL="$(awk -F '=' '/^SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          echo "Detected kernel version: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          test "${VERSION}" = "6"
          test "${PATCHLEVEL}" = "1"

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/pineapple_GKI.config
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          test -f build.config.constants
          TREE_CLANG_VERSION="$(awk -F '=' '/^CLANG_VERSION=/ {print $2; exit}' build.config.constants)"
          test -n "${TREE_CLANG_VERSION}"

          TRIMMED_CLANG="${RAW_CLANG_VERSION// /}"
          TRIMMED_CLANG="${TRIMMED_CLANG#clang-}"
          if [ -n "${TRIMMED_CLANG}" ]; then
            if [[ ! "${TRIMMED_CLANG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::clang_version may only contain letters, numbers, dots, underscores, and hyphens (for example r530567)."
              exit 1
            fi
            CLANG_VERSION="${TRIMMED_CLANG}"
            echo "Using overridden CLANG_VERSION=${CLANG_VERSION} (tree default: ${TREE_CLANG_VERSION})"
          else
            CLANG_VERSION="${TREE_CLANG_VERSION}"
            echo "Using tree default CLANG_VERSION=${CLANG_VERSION}"
          fi

          SHORT_COMMIT="$(git rev-parse --short=7 HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"

          LOCAL_SUFFIX="${RAW_LOCAL_VERSION#-}"
          if [ -n "${LOCAL_SUFFIX}" ]; then
            if [[ ! "${LOCAL_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::local_version may only contain letters, numbers, dots, underscores, and hyphens."
              exit 1
            fi
            KERNEL_NAME="peridot-los24-${LOCAL_SUFFIX}"
          else
            KERNEL_NAME="peridot-los24"
          fi

          FEATURE_TAG="tcp-${TCP_CONGESTION}-opt-${OPTIMIZE_LEVEL}-mlgo-${ENABLE_MLGO}-adios-${ENABLE_ADIOS}-bore-${ENABLE_BORE}-bon-${BORE_DEFAULT_ON}-bbg-${ENABLE_BASEBAND_GUARD}-ds-${ENABLE_DROIDSPACES}-uni-${ENABLE_UNICODE_FIX}-nhusb-${ENABLE_NETHUNTER_USB}"
          ZIP_NAME="${KERNEL_NAME}-${ROOT_VARIANT}-${BUILD_DATE}-${SHORT_COMMIT}.zip"

          {
            echo "KERNEL_VERSION=${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "SHORT_COMMIT=${SHORT_COMMIT}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "LOCAL_SUFFIX=${LOCAL_SUFFIX}"
            echo "KERNEL_NAME=${KERNEL_NAME}"
            echo "FEATURE_TAG=${FEATURE_TAG}"
            echo "ZIP_NAME=${ZIP_NAME}"
          } >> "${GITHUB_ENV}"

# Cache the extracted AOSP Clang/LLVM toolchain by revision so future runs skip downloading it
      - name: Cache AOSP Clang/LLVM toolchain
        id: cache-clang
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      # Download and verify AOSP Clang/LLVM only on a cache miss, then add it to PATH
      - name: Download AOSP Clang/LLVM toolchain
        env:
          CLANG_CACHE_HIT: ${{ steps.cache-clang.outputs.cache-hit }}
        run: |
          set -euxo pipefail
          if [ "${CLANG_CACHE_HIT}" != "true" ] || [ ! -x "${RUNNER_TEMP}/clang/bin/clang" ]; then
            rm -rf "${RUNNER_TEMP}/clang"
            mkdir -p "${RUNNER_TEMP}/clang"
            DOWNLOADED=0
            for REF in refs/heads/main refs/heads/main-kernel refs/heads/android14-release; do
              URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${REF}/clang-${CLANG_VERSION}.tar.gz"
              for ATTEMPT in 1 2 3; do
                rm -f "${RUNNER_TEMP}/clang.tar.gz"
                if curl -fSL --retry 3 --retry-delay 5 "${URL}" -o "${RUNNER_TEMP}/clang.tar.gz" && gzip -t "${RUNNER_TEMP}/clang.tar.gz"; then
                  echo "Downloaded and verified clang-${CLANG_VERSION} from ${REF} (attempt ${ATTEMPT})"
                  DOWNLOADED=1
                  break 2
                fi
                echo "::warning::Download or gzip check failed for ${REF} (attempt ${ATTEMPT}/3); retrying..."
                sleep 5
              done
            done
            if [ "${DOWNLOADED}" -ne 1 ]; then
              echo "::error::Could not download a valid clang-${CLANG_VERSION} archive from AOSP."
              exit 1
            fi
            tar -xzf "${RUNNER_TEMP}/clang.tar.gz" -C "${RUNNER_TEMP}/clang"
            rm -f "${RUNNER_TEMP}/clang.tar.gz"
          else
            echo "Using cached clang-${CLANG_VERSION} from ${RUNNER_TEMP}/clang"
          fi
          "${RUNNER_TEMP}/clang/bin/clang" --version
          echo "${RUNNER_TEMP}/clang/bin" >> "${GITHUB_PATH}"

      # Prepare compiler flags for O2/O3 and probe Clang at -O2 for MLGO register allocation support
      - name: Prepare compiler flags (O2/O3 and MLGO)
        env:
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
        run: |
          set -euxo pipefail
          EXTRA_KCFLAGS=""

          if [ "${OPTIMIZE_LEVEL}" = "O3" ]; then
            EXTRA_KCFLAGS="${EXTRA_KCFLAGS} -O3"
          fi

          if [ "${ENABLE_MLGO}" = "true" ]; then
            if printf 'int mlgo_probe(int a, int b) { return a + b; }\n' \
              | clang --target=aarch64-linux-gnu -O2 -mllvm -regalloc-enable-advisor=release -x c -c - -o /dev/null 2>"${RUNNER_TEMP}/mlgo_probe.err"; then
              EXTRA_KCFLAGS="${EXTRA_KCFLAGS} -mllvm -regalloc-enable-advisor=release"
              echo "MLGO regalloc advisor is supported by clang-${CLANG_VERSION} and has been enabled."
            else
              echo "::warning::clang-${CLANG_VERSION} rejected -mllvm -regalloc-enable-advisor=release (no MLGO model compiled into this prebuilt); skipping MLGO."
              cat "${RUNNER_TEMP}/mlgo_probe.err"
            fi
          fi

          EXTRA_KCFLAGS="${EXTRA_KCFLAGS# }"
          echo "Effective EXTRA_KCFLAGS='${EXTRA_KCFLAGS}'"
          echo "EXTRA_KCFLAGS=${EXTRA_KCFLAGS}" >> "${GITHUB_ENV}"

      # Restore and persist ccache between workflow runs
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ env.CLANG_VERSION }}-${{ inputs.kernel_branch }}-${{ inputs.root_variant }}-${{ env.FEATURE_TAG }}-${{ env.SHORT_COMMIT }}
          restore-keys: |
            ccache-${{ env.CLANG_VERSION }}-${{ inputs.kernel_branch }}-${{ inputs.root_variant }}-${{ env.FEATURE_TAG }}-
            ccache-${{ env.CLANG_VERSION }}-${{ inputs.kernel_branch }}-${{ inputs.root_variant }}-
            ccache-${{ env.CLANG_VERSION }}-${{ inputs.kernel_branch }}-

      # Set ccache size limits and zero out per-run statistics
      - name: Configure ccache
        run: |
          set -euxo pipefail
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache -z

      # Integrate official KernelSU-Next via its documented setup.sh when root_variant is kernelsu-next
      - name: Integrate KernelSU-Next
        if: ${{ inputs.root_variant == 'kernelsu-next' }}
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -euxo pipefail
          cd kernel
          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o "${RUNNER_TEMP}/ksun-setup.sh"
          if [ -n "${KSU_REF}" ]; then
            bash "${RUNNER_TEMP}/ksun-setup.sh" "${KSU_REF}"
          else
            bash "${RUNNER_TEMP}/ksun-setup.sh"
          fi
          test -f drivers/kernelsu/Kconfig

      # Integrate SUSFS-enabled KernelSU-Next and strictly dry-run/apply simonpunk SUSFS gki-android14-6.1 patches
      - name: Integrate KernelSU-Next with SUSFS
        if: ${{ inputs.root_variant == 'kernelsu-next-susfs' }}
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          cd kernel

          REF="${KSU_REF:-dev-susfs}"
          curl -fLSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" \
            -o "${RUNNER_TEMP}/ksun-susfs-setup.sh"
          bash "${RUNNER_TEMP}/ksun-susfs-setup.sh" "${REF}"
          test -f drivers/kernelsu/Kconfig

          git clone --depth=1 --single-branch -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "${RUNNER_TEMP}/susfs4ksu"

          cp -v "${RUNNER_TEMP}/susfs4ksu/kernel_patches/fs/"* fs/
          cp -v "${RUNNER_TEMP}/susfs4ksu/kernel_patches/include/linux/"* include/linux/

          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" \
            "${RUNNER_TEMP}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          rm -fv \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

      # Dry-run and apply local Linux 6.1 ADIOS I/O scheduler patch
      - name: Apply ADIOS I/O scheduler patch (6.1)
        if: ${{ inputs.enable_adios }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          ADIOS_PATCH="${GITHUB_WORKSPACE}/builder/patches/adios-6.1.patch"
          if [ ! -f "${ADIOS_PATCH}" ]; then
            echo "::error::Missing patches/adios-6.1.patch in your builder repository. Add a verified Linux 6.1 ADIOS patch there before enabling enable_adios."
            exit 1
          fi

          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${ADIOS_PATCH}"

          ADIOS_SYM="$(git diff -U0 -- block/Kconfig* | awk '/^\+config[[:space:]]+(MQ_)?IOSCHED_ADIOS$/ {print $2; exit}')"
          if [ -z "${ADIOS_SYM}" ]; then
            echo "::error::ADIOS patch applied, but no MQ_IOSCHED_ADIOS or IOSCHED_ADIOS symbol was found in block/Kconfig*."
            exit 1
          fi
          echo "Detected ADIOS Kconfig symbol: ${ADIOS_SYM}"
          echo "ADIOS_CONFIG_SYM=${ADIOS_SYM}" >> "${GITHUB_ENV}"

      # Dry-run and apply local KMI-safe Linux 6.1 BORE scheduler patch and set sched_bore boot default
      - name: Apply KMI-safe BORE scheduler patch (6.1)
        if: ${{ inputs.enable_bore }}
        env:
          BORE_DEFAULT_ON: ${{ inputs.bore_default_on }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          BORE_PATCH="${GITHUB_WORKSPACE}/builder/patches/bore-6.1-kmi-safe.patch"
          if [ ! -f "${BORE_PATCH}" ]; then
            echo "::error::Missing patches/bore-6.1-kmi-safe.patch in your builder repository. Add a verified KMI-safe Linux 6.1 BORE patch there before enabling enable_bore."
            exit 1
          fi

          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${BORE_PATCH}"

          BORE_SYM="$(git diff -U0 -- init/Kconfig kernel/Kconfig* | awk '/^\+config[[:space:]]+SCHED_BORE$/ {print $2; exit}')"
          if [ -z "${BORE_SYM}" ]; then
            echo "::error::BORE patch applied, but no SCHED_BORE symbol was found in init/Kconfig or kernel/Kconfig*."
            exit 1
          fi
          echo "Detected BORE Kconfig symbol: ${BORE_SYM}"
          echo "BORE_CONFIG_SYM=${BORE_SYM}" >> "${GITHUB_ENV}"

          DESIRED_BORE_VAL="1"
          if [ "${BORE_DEFAULT_ON}" != "true" ]; then
            DESIRED_BORE_VAL="0"
          fi

          mapfile -t BORE_FILES < <(grep -rlE '\bsched_bore[[:space:]]*=[[:space:]]*[01];' kernel/sched/)
          if [ "${#BORE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 file initializing sched_bore in kernel/sched/, found ${#BORE_FILES[@]}."
            exit 1
          fi
          BORE_SRC="${BORE_FILES[0]}"
          sed -i -E "s/(\bsched_bore[[:space:]]*=[[:space:]]*)[01];/\1${DESIRED_BORE_VAL};/" "${BORE_SRC}"
          grep -nE "\bsched_bore[[:space:]]*=[[:space:]]*${DESIRED_BORE_VAL};" "${BORE_SRC}"

      # Integrate Baseband-guard LSM (vc-teahouse/Baseband-guard) and add it to security/Kconfig defaults
      - name: Integrate Baseband-guard LSM
        if: ${{ inputs.enable_baseband_guard }}
        run: |
          set -euxo pipefail
          cd kernel
          curl -fLSs \
            "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh" \
            -o "${RUNNER_TEMP}/bbg-setup.sh"
          bash "${RUNNER_TEMP}/bbg-setup.sh"
          test -f security/baseband-guard/Kconfig

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -q 'baseband_guard' security/Kconfig

      # Dry-run and apply the mandatory Droidspaces GKI SYSVIPC kABI padding patch (for kernels 5.4-6.6)
      - name: Apply Droidspaces kABI padding patch
        if: ${{ inputs.enable_droidspaces }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          git clone --depth=1 --single-branch \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "${RUNNER_TEMP}/Droidspaces-OSS"

          PATCH_PATH="${RUNNER_TEMP}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          test -f "${PATCH_PATH}"

          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${PATCH_PATH}"

      # Dry-run and apply the 6.1 Unicode zero-width path bypass fix (gki_ptrace.patch omitted: already fixed in 6.1)
      - name: Apply 6.1 Unicode path bypass fix
        if: ${{ inputs.enable_unicode_fix }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          git clone --depth=1 --single-branch \
            https://github.com/WildKernels/kernel_patches.git \
            "${RUNNER_TEMP}/wild_kernel_patches"

          UNICODE_PATCH="${RUNNER_TEMP}/wild_kernel_patches/common/unicode_bypass_fix_6.1+.patch"
          test -f "${UNICODE_PATCH}"

          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${UNICODE_PATCH}"

      # Merge gki_defconfig with SM8635/peridot vendor fragments and enable selected GKI-safe options
      - name: Configure kernel (.config)
        env:
          ROOT_VARIANT: ${{ inputs.root_variant }}
          TCP_CONGESTION: ${{ inputs.tcp_congestion }}
          ENABLE_ADIOS: ${{ inputs.enable_adios }}
          ENABLE_BORE: ${{ inputs.enable_bore }}
          ENABLE_BASEBAND_GUARD: ${{ inputs.enable_baseband_guard }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_NETHUNTER_USB: ${{ inputs.enable_nethunter_usb }}
        run: |
          set -euxo pipefail
          cd kernel

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            TARGET_PRODUCT=peridot
          )
          if [ -n "${LOCAL_SUFFIX:-}" ]; then
            MAKE_ARGS+=(LOCALVERSION="-${LOCAL_SUFFIX}")
          fi

          make "${MAKE_ARGS[@]}" \
            gki_defconfig \
            vendor/pineapple_GKI.config \
            vendor/peridot_GKI.config

          # Root options
          if [ "${ROOT_VARIANT}" = "kernelsu-next" ]; then
            ./scripts/config --file out/.config -e KSU
          elif [ "${ROOT_VARIANT}" = "kernelsu-next-susfs" ]; then
            ./scripts/config --file out/.config -e KSU -e KSU_SUSFS
            for sym in \
              KSU_SUSFS_SUS_PATH \
              KSU_SUSFS_SUS_MOUNT \
              KSU_SUSFS_SUS_KSTAT \
              KSU_SUSFS_SPOOF_UNAME \
              KSU_SUSFS_ENABLE_LOG \
              KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              KSU_SUSFS_OPEN_REDIRECT \
              KSU_SUSFS_SUS_MAP; do
              if grep -qE "^config ${sym}$" drivers/kernelsu/Kconfig; then
                ./scripts/config --file out/.config -e "${sym}"
              fi
            done
          fi

          # TCP congestion control (BBR built-in as default)
          if [ "${TCP_CONGESTION}" = "bbr" ]; then
            ./scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED \
              -e TCP_CONG_BBR \
              -e NET_SCH_FQ \
              -d DEFAULT_CUBIC \
              -d DEFAULT_RENO \
              -e DEFAULT_BBR \
              --set-str DEFAULT_TCP_CONG bbr
          fi

          # ADIOS I/O scheduler
          if [ "${ENABLE_ADIOS}" = "true" ]; then
            ./scripts/config --file out/.config -e "${ADIOS_CONFIG_SYM}"
          fi

          # BORE CPU scheduler
          if [ "${ENABLE_BORE}" = "true" ]; then
            ./scripts/config --file out/.config -e "${BORE_CONFIG_SYM}"
          fi

          # Baseband-guard LSM (keep boot and recovery writable, ensure CONFIG_LSM includes baseband_guard)
          if [ "${ENABLE_BASEBAND_GUARD}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e BBG \
              -d BBG_BLOCK_BOOT \
              -d BBG_BLOCK_RECOVERY
            CUR_LSM="$(awk -F '=' '/^CONFIG_LSM=/ {gsub(/"/, "", $2); print $2; exit}' out/.config)"
            if [ -n "${CUR_LSM}" ] && [[ ",${CUR_LSM}," != *",baseband_guard,"* ]]; then
              ./scripts/config --file out/.config --set-str LSM "${CUR_LSM},baseband_guard"
            fi
          fi

          # Droidspaces GKI ABI-safe container options (CFS_BANDWIDTH and CGROUP_PIDS omitted intentionally)
          if [ "${ENABLE_DROIDSPACES}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e SYSVIPC \
              -e POSIX_MQUEUE \
              -e IPC_NS \
              -e PID_NS \
              -e DEVTMPFS \
              -e NETFILTER_XT_MATCH_ADDRTYPE \
              -e USER_NS \
              -e IP6_NF_NAT \
              -e IP6_NF_TARGET_MASQUERADE \
              -e MACVLAN \
              -e IP_NF_TARGET_REJECT \
              -e IP6_NF_TARGET_REJECT \
              -e NETFILTER_XT_TARGET_LOG \
              -e NETFILTER_XT_MATCH_RECENT \
              -e IP_SET \
              -e IP_SET_HASH_IP \
              -e IP_SET_HASH_NET \
              -e NETFILTER_XT_SET \
              -e TMPFS_POSIX_ACL \
              -e TMPFS_XATTR
          fi

          # GKI-safe Kali NetHunter USB subset (only enables missing symbols; never overrides existing =m modules)
          if [ "${ENABLE_NETHUNTER_USB}" = "true" ]; then
            grep -E '^CONFIG_USB_.*=m$' out/.config > "${RUNNER_TEMP}/stock_usb_modules.txt" || true

            NH_USB_SYMS=(
              USB_CONFIGFS_F_HID
              USB_CONFIGFS_SERIAL
              USB_CONFIGFS_ACM
              USB_CONFIGFS_OBEX
              USB_CONFIGFS_NCM
              USB_CONFIGFS_ECM
              USB_CONFIGFS_ECM_SUBSET
              USB_CONFIGFS_RNDIS
              USB_CONFIGFS_EEM
              USB_CONFIGFS_MASS_STORAGE
              USB_ACM
            )

            # Skip USB_SERIAL* built-ins if stock GKI ships USB_SERIAL as a loadable module (=m)
            if ! grep -qx 'CONFIG_USB_SERIAL=m' out/.config; then
              NH_USB_SYMS+=(
                USB_SERIAL
                USB_SERIAL_GENERIC
                USB_SERIAL_CP210X
                USB_SERIAL_FTDI_SIO
                USB_SERIAL_PL2303
                USB_SERIAL_CH341
              )
            else
              echo "Skipping USB_SERIAL* built-ins because CONFIG_USB_SERIAL=m in stock GKI config."
            fi

            # Skip USB_USBNET* built-ins if stock GKI ships USB_USBNET as a loadable module (=m)
            if ! grep -qx 'CONFIG_USB_USBNET=m' out/.config; then
              NH_USB_SYMS+=(
                USB_NET_DRIVERS
                USB_USBNET
                USB_RTL8150
                USB_RTL8152
                USB_LAN78XX
                USB_NET_AX8817X
                USB_NET_AX88179_178A
                USB_NET_CDCETHER
                USB_NET_RNDIS_HOST
              )
            else
              echo "Skipping USB_USBNET* built-ins because CONFIG_USB_USBNET=m in stock GKI config."
            fi

            for sym in "${NH_USB_SYMS[@]}"; do
              if grep -qE "^CONFIG_${sym}=[ym]$" out/.config; then
                echo "Preserving existing stock setting for CONFIG_${sym}"
              else
                ./scripts/config --file out/.config -e "${sym}"
              fi
            done
          fi

      # Compile the GKI kernel Image with selected optimization/MLGO flags and capture the full build log
      - name: Build kernel Image
        run: |
          set -euxo pipefail
          cd kernel

          BUILD_LOG="${GITHUB_WORKSPACE}/build.log"
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            TARGET_PRODUCT=peridot
          )
          if [ -n "${LOCAL_SUFFIX:-}" ]; then
            MAKE_ARGS+=(LOCALVERSION="-${LOCAL_SUFFIX}")
          fi
          if [ -n "${EXTRA_KCFLAGS:-}" ]; then
            MAKE_ARGS+=(KCFLAGS="${EXTRA_KCFLAGS}")
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image 2>&1 | tee "${BUILD_LOG}"
          test -s out/arch/arm64/boot/Image
          ccache -s

      # Package Image.gz into an official osm0sis/AnyKernel3 zip with 64-bit arm64 tools for peridot
      - name: Package AnyKernel3 flashable zip
        env:
          ROOT_VARIANT: ${{ inputs.root_variant }}
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${RUNNER_TEMP}/AnyKernel3"
          git clone --depth=1 --single-branch -b arm64-tools https://github.com/osm0sis/AnyKernel3.git "${RUNNER_TEMP}/AnyKernel3-arm64-tools"

          if [ -d "${RUNNER_TEMP}/AnyKernel3-arm64-tools/tools" ]; then
            TOOLS_SRC="${RUNNER_TEMP}/AnyKernel3-arm64-tools/tools"
          else
            TOOLS_SRC="${RUNNER_TEMP}/AnyKernel3-arm64-tools"
          fi

          for bin in busybox magiskboot magiskpolicy fec httools_static lptools_static snapshotupdater_static; do
            if [ -f "${TOOLS_SRC}/${bin}" ]; then
              cp -fv "${TOOLS_SRC}/${bin}" "${RUNNER_TEMP}/AnyKernel3/tools/${bin}"
            fi
          done
          chmod +x "${RUNNER_TEMP}/AnyKernel3/tools/"*

          # Confirm busybox and magiskboot are 64-bit ARM64 binaries before zipping
          readelf -h "${RUNNER_TEMP}/AnyKernel3/tools/busybox" | grep -q "ELF64"
          readelf -h "${RUNNER_TEMP}/AnyKernel3/tools/busybox" | grep -q "AArch64"
          readelf -h "${RUNNER_TEMP}/AnyKernel3/tools/magiskboot" | grep -q "ELF64"
          readelf -h "${RUNNER_TEMP}/AnyKernel3/tools/magiskboot" | grep -q "AArch64"

          rm -rf \
            "${RUNNER_TEMP}/AnyKernel3/.git" \
            "${RUNNER_TEMP}/AnyKernel3/.github" \
            "${RUNNER_TEMP}/AnyKernel3/ramdisk" \
            "${RUNNER_TEMP}/AnyKernel3/patch" \
            "${RUNNER_TEMP}/AnyKernel3/modules" \
            "${RUNNER_TEMP}/AnyKernel3/README.md"

          KERNEL_STRING="${KERNEL_NAME} (${ROOT_VARIANT}, ${KERNEL_VERSION}, ${SHORT_COMMIT})"
          cp -v "${GITHUB_WORKSPACE}/builder/anykernel3/anykernel.sh" "${RUNNER_TEMP}/AnyKernel3/anykernel.sh"
          sed -i "s|__KERNEL_STRING__|${KERNEL_STRING}|g" "${RUNNER_TEMP}/AnyKernel3/anykernel.sh"

          # Compress raw Image to Image.gz for AnyKernel3
          gzip -n -9 -c kernel/out/arch/arm64/boot/Image > "${RUNNER_TEMP}/AnyKernel3/Image.gz"
          test -s "${RUNNER_TEMP}/AnyKernel3/Image.gz"

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          (cd "${RUNNER_TEMP}/AnyKernel3" && zip -r9 "${GITHUB_WORKSPACE}/artifacts/${ZIP_NAME}" .)
          cp -v kernel/out/arch/arm64/boot/Image "${GITHUB_WORKSPACE}/artifacts/Image"
          cp -v "${RUNNER_TEMP}/AnyKernel3/Image.gz" "${GITHUB_WORKSPACE}/artifacts/Image.gz"
          cp -v "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/artifacts/build.log"
          ls -lh "${GITHUB_WORKSPACE}/artifacts"

      # Upload the AnyKernel3 zip, raw Image, Image.gz, and build log as a workflow artifact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.KERNEL_NAME }}-${{ inputs.root_variant }}-${{ env.BUILD_DATE }}-${{ env.SHORT_COMMIT }}
          path: artifacts/
          if-no-files-found: error

      # Upload the build log on failure so compilation errors can still be downloaded
      - name: Upload build log on failure
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v6
        with:
          name: failed-build-log-${{ inputs.root_variant }}-${{ github.run_id }}
          path: build.log
          if-no-files-found: error
