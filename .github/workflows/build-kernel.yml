name: Build POCO F6 (peridot) LineageOS 24.0 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository (owner/repo)"
        required: true
        default: "tuyulmakyul001-hub/android_kernel_xiaomi_sm8635"
        type: string
      kernel_branch:
        description: "Kernel branch, tag, or commit SHA"
        required: true
        default: "lineage-24.0"
        type: string
      root_variant:
        description: "Root / KernelSU variant"
        required: true
        default: "kernelsu-next-susfs"
        type: choice
        options:
          - kernelsu-next-susfs
          - kernelsu-next
          - kernelsu
          - sukisu-ultra
          - none
      local_version:
        description: "Optional custom suffix (letters, numbers, ., _, -)"
        required: false
        default: ""
        type: string
      clang_version:
        description: "Optional AOSP Clang override (e.g. r530567; blank = tree default)"
        required: false
        default: ""
        type: string
      tcp_congestion:
        description: "Default TCP congestion control"
        required: true
        default: "bbr"
        type: choice
        options:
          - bbr
          - stock
      optimize_level:
        description: "Compiler optimization level"
        required: true
        default: "O2"
        type: choice
        options:
          - O2
          - O3
      enable_mlgo:
        description: "Enable Clang MLGO register allocation advisor"
        required: false
        default: true
        type: boolean
      enable_adios:
        description: "Enable ADIOS I/O scheduler (patches/adios-6.1.patch)"
        required: false
        default: true
        type: boolean
      enable_bore:
        description: "Enable KMI-safe BORE CPU scheduler (patches/bore-6.1-kmi-safe.patch)"
        required: false
        default: false
        type: boolean
      bore_default_on:
        description: "Enable BORE by default at boot (when enable_bore is checked)"
        required: false
        default: true
        type: boolean
      enable_baseband_guard:
        description: "Enable Baseband-guard LSM"
        required: false
        default: true
        type: boolean
      enable_droidspaces:
        description: "Enable Droidspaces container kernel configs"
        required: false
        default: true
        type: boolean
      enable_unicode_fix:
        description: "Enable Unicode / NLS UTF-8 path support"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Publish flashable zip to GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build peridot 6.1 kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 python3 rsync \
            unzip xz-utils zip zstd

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_branch }}
          path: kernel
          fetch-depth: 1

      - name: Inspect kernel tree and compute build metadata
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          ROOT_VARIANT: ${{ inputs.root_variant }}
          RAW_LOCAL_VERSION: ${{ inputs.local_version }}
          RAW_CLANG_VERSION: ${{ inputs.clang_version }}
          TCP_CONGESTION: ${{ inputs.tcp_congestion }}
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
          ENABLE_ADIOS: ${{ inputs.enable_adios }}
          ENABLE_BORE: ${{ inputs.enable_bore }}
          BORE_DEFAULT_ON: ${{ inputs.bore_default_on }}
          ENABLE_BASEBAND_GUARD: ${{ inputs.enable_baseband_guard }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_UNICODE_FIX: ${{ inputs.enable_unicode_fix }}
        run: |
          set -euxo pipefail
          cd kernel

          VERSION="$(awk -F '=' '/^VERSION[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          PATCHLEVEL="$(awk -F '=' '/^PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          SUBLEVEL="$(awk -F '=' '/^SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)"
          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          echo "Detected kernel version: ${KERNEL_VERSION}"
          test "${VERSION}" = "6"
          test "${PATCHLEVEL}" = "1"

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/pineapple_GKI.config
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          test -f build.config.constants
          TREE_CLANG_VERSION="$(awk -F '=' '/^CLANG_VERSION=/ {print $2; exit}' build.config.constants)"
          test -n "${TREE_CLANG_VERSION}"

          TRIMMED_CLANG="${RAW_CLANG_VERSION// /}"
          TRIMMED_CLANG="${TRIMMED_CLANG#clang-}"
          if [ -n "${TRIMMED_CLANG}" ]; then
            if [[ ! "${TRIMMED_CLANG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::clang_version may only contain letters, numbers, dots, underscores, and hyphens (for example r530567)."
              exit 1
            fi
            CLANG_VERSION="${TRIMMED_CLANG}"
            echo "Using overridden CLANG_VERSION=${CLANG_VERSION} (tree default: ${TREE_CLANG_VERSION})"
          else
            CLANG_VERSION="${TREE_CLANG_VERSION}"
            echo "Using tree default CLANG_VERSION=${CLANG_VERSION}"
          fi

          SHORT_COMMIT="$(git rev-parse --short=7 HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"

          LOCAL_SUFFIX="${RAW_LOCAL_VERSION#-}"
          if [ -n "${LOCAL_SUFFIX}" ]; then
            if [[ ! "${LOCAL_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::local_version may only contain letters, numbers, dots, underscores, and hyphens."
              exit 1
            fi
            KERNEL_NAME="peridot-los24-${LOCAL_SUFFIX}"
          else
            KERNEL_NAME="peridot-los24"
          fi

          FEATURE_TAG="tcp-${TCP_CONGESTION}-opt-${OPTIMIZE_LEVEL}-mlgo-${ENABLE_MLGO}-adios-${ENABLE_ADIOS}-bore-${ENABLE_BORE}-bon-${BORE_DEFAULT_ON}-bbg-${ENABLE_BASEBAND_GUARD}-ds-${ENABLE_DROIDSPACES}-uni-${ENABLE_UNICODE_FIX}"

          case "${ROOT_VARIANT}" in
            kernelsu-next-susfs) ROOT_TAG="KSUN-SUSFS" ;;
            kernelsu-next)       ROOT_TAG="KSUN" ;;
            kernelsu)            ROOT_TAG="KSU" ;;
            sukisu-ultra)        ROOT_TAG="SukiSU" ;;
            *)                   ROOT_TAG="${ROOT_VARIANT}" ;;
          esac

          FEAT_TAGS=""
          if [ "${TCP_CONGESTION}" = "bbr" ]; then FEAT_TAGS="${FEAT_TAGS}-BBR"; fi
          if [ "${OPTIMIZE_LEVEL}" = "O3" ]; then FEAT_TAGS="${FEAT_TAGS}-O3"; fi
          if [ "${ENABLE_MLGO}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-MLGO"; fi
          if [ "${ENABLE_ADIOS}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-ADIOS"; fi
          if [ "${ENABLE_BORE}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-BORE"; fi
          if [ "${ENABLE_BASEBAND_GUARD}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-BBG"; fi
          if [ "${ENABLE_DROIDSPACES}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-DS"; fi
          if [ "${ENABLE_UNICODE_FIX}" = "true" ]; then FEAT_TAGS="${FEAT_TAGS}-UNI"; fi

          ARTIFACT_NAME="${KERNEL_NAME}-${KERNEL_VERSION}-${ROOT_TAG}${FEAT_TAGS}-${BUILD_DATE}-${SHORT_COMMIT}"
          ZIP_NAME="${ARTIFACT_NAME}.zip"
          SOURCE_TAG="$(printf '%s-%s' "${KERNEL_REPO}" "${KERNEL_BRANCH}" | tr -c 'A-Za-z0-9._-' '-')"
          {
            echo "KERNEL_REPO=${KERNEL_REPO}"
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}"
            echo "SOURCE_TAG=${SOURCE_TAG}"          
            echo "KERNEL_VERSION=${KERNEL_VERSION}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "SHORT_COMMIT=${SHORT_COMMIT}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "LOCAL_SUFFIX=${LOCAL_SUFFIX}"
            echo "KERNEL_NAME=${KERNEL_NAME}"
            echo "FEATURE_TAG=${FEATURE_TAG}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            echo "ZIP_NAME=${ZIP_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Cache AOSP Clang/LLVM toolchain
        id: cache-clang
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      - name: Download AOSP Clang/LLVM toolchain
        env:
          CLANG_CACHE_HIT: ${{ steps.cache-clang.outputs.cache-hit }}
        run: |
          set -euxo pipefail
          if [ "${CLANG_CACHE_HIT}" != "true" ] || [ ! -x "${RUNNER_TEMP}/clang/bin/clang" ]; then
            rm -rf "${RUNNER_TEMP}/clang"
            mkdir -p "${RUNNER_TEMP}/clang"
            DOWNLOADED=0
            for REF in refs/heads/main refs/heads/main-kernel refs/heads/android14-release; do
              URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${REF}/clang-${CLANG_VERSION}.tar.gz"
              for ATTEMPT in 1 2 3; do
                rm -f "${RUNNER_TEMP}/clang.tar.gz"
                if curl -fSL --retry 3 --retry-delay 5 "${URL}" -o "${RUNNER_TEMP}/clang.tar.gz" && gzip -t "${RUNNER_TEMP}/clang.tar.gz"; then
                  echo "Downloaded and verified clang-${CLANG_VERSION} from ${REF} (attempt ${ATTEMPT})"
                  DOWNLOADED=1
                  break 2
                fi
                echo "::warning::Download or gzip check failed for ${REF} (attempt ${ATTEMPT}/3); retrying..."
                sleep 5
              done
            done
            if [ "${DOWNLOADED}" -ne 1 ]; then
              echo "::error::Could not download a valid clang-${CLANG_VERSION} archive from AOSP."
              exit 1
            fi
            tar -xzf "${RUNNER_TEMP}/clang.tar.gz" -C "${RUNNER_TEMP}/clang"
            rm -f "${RUNNER_TEMP}/clang.tar.gz"
          else
            echo "Using cached clang-${CLANG_VERSION} from ${RUNNER_TEMP}/clang"
          fi
          "${RUNNER_TEMP}/clang/bin/clang" --version
          echo "${RUNNER_TEMP}/clang/bin" >> "${GITHUB_PATH}"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-peridot-${{ env.SOURCE_TAG }}-${{ env.CLANG_VERSION }}-${{ inputs.root_variant }}-${{ env.FEATURE_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-peridot-${{ env.SOURCE_TAG }}-${{ env.CLANG_VERSION }}-${{ inputs.root_variant }}-${{ env.FEATURE_TAG }}-
            ccache-peridot-${{ env.SOURCE_TAG }}-${{ env.CLANG_VERSION }}-${{ inputs.root_variant }}-
            ccache-peridot-${{ env.SOURCE_TAG }}-${{ env.CLANG_VERSION }}-

      - name: Prepare compiler flags
        env:
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
        run: |
          set -euxo pipefail
          EXTRA_KCFLAGS=""
          if [ "${ENABLE_MLGO}" = "true" ]; then
            if clang -mllvm -regalloc-enable-advisor=release -x c -c /dev/null -o /dev/null 2>/dev/null; then
              EXTRA_KCFLAGS="${EXTRA_KCFLAGS} -mllvm -regalloc-enable-advisor=release"
            else
              echo "::warning::Selected Clang (${CLANG_VERSION}) does not support -mllvm -regalloc-enable-advisor=release; skipping MLGO."
            fi
          fi
          if [ "${OPTIMIZE_LEVEL}" = "O3" ]; then
            EXTRA_KCFLAGS="${EXTRA_KCFLAGS} -O3"
          fi
          EXTRA_KCFLAGS="$(echo "${EXTRA_KCFLAGS}" | xargs)"
          echo "EXTRA_KCFLAGS=${EXTRA_KCFLAGS}" >> "${GITHUB_ENV}"

      - name: Setup root variant (KernelSU / KernelSU-Next / SukiSU)
        if: ${{ inputs.root_variant != 'none' }}
        env:
          ROOT_VARIANT: ${{ inputs.root_variant }}
        run: |
          set -euxo pipefail
          cd kernel
          case "${ROOT_VARIANT}" in
            kernelsu-next-susfs)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs
              git clone --depth=1 -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git "${RUNNER_TEMP}/susfs4ksu"
              cp -v "${RUNNER_TEMP}/susfs4ksu/kernel_patches/fs/"* fs/
              cp -v "${RUNNER_TEMP}/susfs4ksu/kernel_patches/include/linux/"* include/linux/
              patch -p1 --forward < "${RUNNER_TEMP}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" || true
              ;;
            kernelsu-next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              ;;
            kernelsu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
              ;;
            sukisu-ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
              ;;
          esac

      - name: Apply ADIOS I/O scheduler patch (6.1)
        if: ${{ inputs.enable_adios }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          ADIOS_PATCH="${GITHUB_WORKSPACE}/builder/patches/adios-6.1.patch"
          if [ ! -f "${ADIOS_PATCH}" ]; then
            echo "::error::Missing patches/adios-6.1.patch in your builder repository."
            exit 1
          fi
          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${ADIOS_PATCH}"
          ADIOS_SYM="$(git diff -U0 -- block/Kconfig.iosched | awk '/^\+config[[:space:]]+MQ_IOSCHED_ADIOS$/ {print $2; exit}')"
          if [ -z "${ADIOS_SYM}" ]; then
            echo "::error::ADIOS patch applied, but no MQ_IOSCHED_ADIOS symbol was found in block/Kconfig.iosched."
            exit 1
          fi
          echo "Detected ADIOS Kconfig symbol: ${ADIOS_SYM}"
          echo "ADIOS_CONFIG_SYM=${ADIOS_SYM}" >> "${GITHUB_ENV}"

      - name: Apply KMI-safe BORE scheduler patch (6.1)
        if: ${{ inputs.enable_bore }}
        env:
          BORE_DEFAULT_ON: ${{ inputs.bore_default_on }}
        run: |
          set -euxo pipefail
          chmod +x "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh"
          BORE_PATCH="${GITHUB_WORKSPACE}/builder/patches/bore-6.1-kmi-safe.patch"
          if [ ! -f "${BORE_PATCH}" ]; then
            echo "::error::Missing patches/bore-6.1-kmi-safe.patch in your builder repository."
            exit 1
          fi
          cd kernel
          "${GITHUB_WORKSPACE}/builder/scripts/apply_patch_strict.sh" "${BORE_PATCH}"

          BORE_SYM="$(git diff -U0 -- init/Kconfig kernel/Kconfig* | awk '/^\+config[[:space:]]+SCHED_BORE$/ {print $2; exit}')"
          if [ -z "${BORE_SYM}" ]; then
            echo "::error::BORE patch applied, but no SCHED_BORE symbol was found in init/Kconfig or kernel/Kconfig*."
            exit 1
          fi
          echo "Detected BORE Kconfig symbol: ${BORE_SYM}"
          echo "BORE_CONFIG_SYM=${BORE_SYM}" >> "${GITHUB_ENV}"

          DESIRED_BORE_VAL="1"
          if [ "${BORE_DEFAULT_ON}" != "true" ]; then
            DESIRED_BORE_VAL="0"
          fi

          mapfile -t BORE_FILES < <(grep -rlE '\bsched_bore[[:space:]]*=[[:space:]]*[01];' kernel/sched/)
          if [ "${#BORE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 file initializing sched_bore in kernel/sched/, found ${#BORE_FILES[@]}."
            exit 1
          fi
          BORE_SRC="${BORE_FILES[0]}"
          sed -i -E "s/(\bsched_bore[[:space:]]*=[[:space:]]*)[01];/\1${DESIRED_BORE_VAL};/" "${BORE_SRC}"
          grep -nE "\bsched_bore[[:space:]]*=[[:space:]]*${DESIRED_BORE_VAL};" "${BORE_SRC}"

      - name: Setup Baseband-guard LSM
        if: ${{ inputs.enable_baseband_guard }}
        run: |
          set -euxo pipefail
          cd kernel
          curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Configure kernel (.config)
        env:
          ROOT_VARIANT: ${{ inputs.root_variant }}
          TCP_CONGESTION: ${{ inputs.tcp_congestion }}
          ENABLE_ADIOS: ${{ inputs.enable_adios }}
          ENABLE_BORE: ${{ inputs.enable_bore }}
          ENABLE_BASEBAND_GUARD: ${{ inputs.enable_baseband_guard }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_UNICODE_FIX: ${{ inputs.enable_unicode_fix }}
        run: |
          set -euxo pipefail
          cd kernel

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
          )

          make "${MAKE_ARGS[@]}" \
            gki_defconfig \
            vendor/pineapple_GKI.config \
            vendor/peridot_GKI.config

          if [ -n "${LOCAL_SUFFIX}" ]; then
            ./scripts/config --file out/.config --set-str LOCALVERSION "-${LOCAL_SUFFIX}"
          fi

          if [ "${ROOT_VARIANT}" != "none" ]; then
            ./scripts/config --file out/.config -e KSU
          fi
          if [ "${ROOT_VARIANT}" = "kernelsu-next-susfs" ]; then
            ./scripts/config --file out/.config -e KSU_SUSFS
          fi

          if [ "${TCP_CONGESTION}" = "bbr" ]; then
            ./scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED \
              -e TCP_CONG_BBR \
              -e DEFAULT_BBR \
              --set-str DEFAULT_TCP_CONG "bbr"
          fi

          if [ "${ENABLE_ADIOS}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e "${ADIOS_CONFIG_SYM}" \
              -d MQ_IOSCHED_DEFAULT_ADIOS
          fi

          if [ "${ENABLE_BORE}" = "true" ]; then
            ./scripts/config --file out/.config -e "${BORE_CONFIG_SYM}"
          fi

          if [ "${ENABLE_BASEBAND_GUARD}" = "true" ]; then
            ./scripts/config --file out/.config -e BBG
            CURRENT_LSM="$(awk -F '=' '/^CONFIG_LSM=/ {gsub(/"/, "", $2); print $2}' out/.config || true)"
            if [[ ",${CURRENT_LSM}," != *",baseband_guard,"* ]]; then
              NEW_LSM="${CURRENT_LSM:+${CURRENT_LSM},}baseband_guard"
              ./scripts/config --file out/.config --set-str LSM "${NEW_LSM}"
            fi
          fi

          if [ "${ENABLE_DROIDSPACES}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e SYSVIPC \
              -e POSIX_MQUEUE \
              -e NAMESPACES \
              -e UTS_NS \
              -e IPC_NS \
              -e USER_NS \
              -e PID_NS \
              -e NET_NS \
              -e CGROUP_DEVICE \
              -e CGROUP_PIDS \
              -e MEMCG \
              -e DEVTMPFS \
              -e OVERLAY_FS
          fi

          if [ "${ENABLE_UNICODE_FIX}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e UNICODE \
              -e NLS_UTF8
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          if [ "${TCP_CONGESTION}" = "bbr" ]; then
            grep -qx 'CONFIG_TCP_CONG_BBR=y' out/.config
            grep -qx 'CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config
          fi
          if [ "${ENABLE_ADIOS}" = "true" ]; then
            grep -qx "CONFIG_${ADIOS_CONFIG_SYM}=y" out/.config
          fi
          if [ "${ENABLE_BORE}" = "true" ]; then
            grep -qx "CONFIG_${BORE_CONFIG_SYM}=y" out/.config
          fi
          if [ "${ENABLE_BASEBAND_GUARD}" = "true" ]; then
            grep -qx 'CONFIG_BBG=y' out/.config
            grep -q 'baseband_guard' out/.config
          fi

      - name: Build kernel Image
        run: |
          set -euxo pipefail
          cd kernel
          ccache -M 4G
          ccache -z

          MAKE_ARGS=(
            -j"$(nproc)"
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            CROSS_COMPILE=aarch64-linux-gnu-
          )
          if [ -n "${EXTRA_KCFLAGS:-}" ]; then
            MAKE_ARGS+=(KCFLAGS="${EXTRA_KCFLAGS}")
          fi

          make "${MAKE_ARGS[@]}" Image
          test -s out/arch/arm64/boot/Image
          ccache -s

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euxo pipefail
          rm -rf "${RUNNER_TEMP}/AnyKernel3" "${GITHUB_WORKSPACE}/artifacts"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${RUNNER_TEMP}/AnyKernel3"

          cat > "${RUNNER_TEMP}/AnyKernel3/anykernel.sh" << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=__KERNEL_NAME__ (__KERNEL_VERSION__)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          device.name2=POCO F6
          supported.versions=14-16
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          sed -i "s|__KERNEL_NAME__|${KERNEL_NAME}|g; s|__KERNEL_VERSION__|${KERNEL_VERSION}|g" \
            "${RUNNER_TEMP}/AnyKernel3/anykernel.sh"

          gzip -n -9 -c kernel/out/arch/arm64/boot/Image > "${RUNNER_TEMP}/AnyKernel3/Image.gz"
          test -s "${RUNNER_TEMP}/AnyKernel3/Image.gz"

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          (
            cd "${RUNNER_TEMP}/AnyKernel3"
            zip -r9 "${GITHUB_WORKSPACE}/artifacts/${ZIP_NAME}" . -x '*.git*' 'README.md' '*placeholder'
          )
          test -s "${GITHUB_WORKSPACE}/artifacts/${ZIP_NAME}"
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: Publish flashable kernel zip to GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          ZIP_PATH="${GITHUB_WORKSPACE}/artifacts/${ZIP_NAME}"
          test -s "${ZIP_PATH}"
          RELEASE_TAG="${BUILD_DATE}-${SHORT_COMMIT}-r${GITHUB_RUN_NUMBER}"
          gh release create "${RELEASE_TAG}" "${ZIP_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${ARTIFACT_NAME}" \
            --notes "POCO F6 (peridot) kernel ${KERNEL_VERSION} from ${KERNEL_REPO}@${KERNEL_BRANCH} (${SHORT_COMMIT}), built with Clang ${CLANG_VERSION}. Flags: ${FEATURE_TAG}"

      - name: Upload flashable kernel zip (test-only artifact)
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/artifacts/${{ env.ZIP_NAME }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
